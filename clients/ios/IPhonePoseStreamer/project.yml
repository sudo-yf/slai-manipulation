name: IPhonePoseStreamer
options:
  bundleIdPrefix: com.robotteleoperation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  IPhonePoseStreamer:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robotteleoperation.iphone-pose-streamer
        PRODUCT_NAME: iPhone Pose
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: ARKit.framework
      - sdk: Network.framework
      - sdk: SceneKit.framework
