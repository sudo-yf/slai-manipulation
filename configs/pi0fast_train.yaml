schema_version: 1
# LeRobot PyTorch PI0-Fast fine-tuning configuration.
dataset:
  repo_id: local/slai-ur5-wujihand-pi05
  root: data/training/pi05/block_into_box_v30
  video_backend: pyav
policy:
  type: pi0_fast
  path: data/models/pi0fast-base
  device: cuda
  dtype: bfloat16
  chunk_size: 15
  n_action_steps: 15
  max_state_dim: 32
  max_action_dim: 32
output_dir: outputs/pi0fast/block_into_box
job_name: slai_pi0fast_block_into_box
steps: 30000
batch_size: 4
num_workers: 0
save_freq: 5000
wandb:
  enable: false
