<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SLAI-teleop</title>
    <link rel="stylesheet" href="/styles.css?v=20260823-4" />
  </head>
  <body>
    <main class="workspace">
      <section class="camera-grid" id="camera-grid" aria-label="Live camera feeds"></section>

      <section class="operator-grid">
        <div class="glass-panel input-panel">
          <div class="panel-head">
            <h2>Input Map</h2>
            <div class="spacemouse-state">
              <span class="connection-dot" aria-hidden="true"></span>
              <span id="spacemouse-connection-state">SpaceMouse Pro</span>
              <span id="spacemouse-age">--</span>
            </div>
          </div>
          <div class="spacemouse-wrap">
            <div id="spacemouse-container" role="img" aria-label="Read-only SpaceMouse Pro physical input map"></div>
            <span id="spacemouse-puck" aria-hidden="true"></span>
          </div>
          <div class="axis-strip" aria-label="SpaceMouse six degree-of-freedom values">
            <span data-axis="0"><b>X</b><output>0.00</output></span>
            <span data-axis="1"><b>Y</b><output>0.00</output></span>
            <span data-axis="2"><b>Z</b><output>0.00</output></span>
            <span data-axis="3"><b>RX</b><output>0.00</output></span>
            <span data-axis="4"><b>RY</b><output>0.00</output></span>
            <span data-axis="5"><b>RZ</b><output>0.00</output></span>
          </div>
        </div>

        <div class="glass-panel event-panel">
          <div class="panel-head">
            <h2>System Events Log</h2>
            <div class="system-state">
              <span class="system-indicator"><i></i><span id="system-label">Sys: Starting</span></span>
              <span class="record-indicator" data-state="starting"><i></i><span id="record-label">Preparing</span></span>
            </div>
          </div>
          <div class="event-table" role="log" aria-live="polite">
            <div class="event-columns" aria-hidden="true">
              <span>Timestamp</span><span>Level</span><span>Message</span>
            </div>
            <div class="event-list">
              <div class="event empty">Waiting for collection events.</div>
            </div>
          </div>
          <div class="health-line">
            <span id="device-summary">UR5 -- · WujiHand -- · Wrist --</span>
            <span class="temperature-status" data-level="unknown">Wuji Temp: <strong>--</strong></span>
          </div>
        </div>
      </section>
    </main>

    <template id="camera-template">
      <figure class="camera-feed" data-online="false" data-frame="false">
        <video autoplay muted playsinline></video>
        <img alt="Live RGB camera feed" />
        <span class="camera-empty">WAITING FOR CAMERA</span>
        <div class="feed-overlays">
          <span class="camera-title"><i aria-hidden="true"></i><span class="camera-label"></span></span>
          <span class="camera-stats">
            <span class="camera-format">--</span>
            <span class="camera-latency">Lat: --</span>
          </span>
        </div>
      </figure>
    </template>
    <script src="/app.js?v=20260823-7" defer></script>
  </body>
</html>
